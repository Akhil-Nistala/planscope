# Header spellings seen on real schedules, keyed by canonical field. The canonical key is
# what ends up in `canonical_headers`; the generator picks one spelling per table.
header_variants:
  ja:
    level: [階, 階数]
    room: [室名, 部屋名, 室 名]
    floor: [床, 床仕上, 床仕上げ]
    baseboard: [幅木, 巾木]
    wall: [壁, 壁仕上, 壁仕上げ]
    ceiling: [天井, 天井仕上, 天井仕上げ]
    remarks: [備考, 摘要]
  en:
    level: [Level, Floor Level]
    room: [Room, Room Name, Space]
    floor: [Floor, Floor Finish, FLR]
    baseboard: [Baseboard, Skirting, Base]
    wall: [Wall, Wall Finish, WALL]
    ceiling: [Ceiling, Ceiling Finish, CLG]
    remarks: [Remarks, Notes]

levels:
  ja: [B1階, 1階, 2階, 3階, 4階, 5階, RF]
  en: [B1, L1, L2, L3, L4, L5, Roof]

remarks:
  ja: ["", "", "", 既存, 改修, 新設, 既存のまま, "CH=2600", "CH=2400", 要分析, -]
  en: ["", "", "", existing, refurbished, new, retain, "CH=2600", "CH=2400", sample req., "-"]

schedule_titles:
  ja: [仕上表, 内部仕上表, 室内仕上表, 内部仕上げ表, 既存仕上表]
  en: [FINISH SCHEDULE, ROOM FINISH SCHEDULE, INTERNAL FINISHES, SCHEDULE OF FINISHES]

notes_headings:
  ja: [特記仕様書, 特記事項, 一般事項, 注記, 石綿含有建材に関する特記]
  en: [GENERAL NOTES, NOTES, SPECIFICATION NOTES, ASBESTOS NOTES]

# {floor} {baseboard} {wall} {ceiling} {room} {n} are filled from the lists above.
note_templates:
  ja:
    - "{room}の{ceiling}は撤去前に石綿含有の有無を確認すること。"
    - "既存{floor}の下地調整材は分析を行い、結果に応じて処理すること。"
    - "{wall}の改修範囲は別途協議とする。"
    - "解体時は飛散防止措置を講じ、関係法令に従い処理すること。"
    - "{room}の既存{baseboard}は撤去し、新規に取り替えること。"
    - "事前調査結果は報告書No.{n}による。"
    - "仕上げ材の品番・色番は監督員と協議の上決定する。"
  en:
    - "Confirm asbestos content of existing {ceiling} in {room} before removal."
    - "Sample levelling compound under existing {floor} prior to stripping."
    - "Extent of {wall} works to be agreed on site."
    - "Removal to follow dust suppression and statutory disposal procedures."
    - "Replace existing {baseboard} in {room} throughout."
    - "Refer to pre-demolition survey report No. {n}."
    - "Colours and product codes to be confirmed by the contract administrator."

# Leader callouts placed on floor plans.
callout_templates:
